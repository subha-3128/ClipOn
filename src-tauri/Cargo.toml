[package]
name = "clipon"
version = "0.1.3"
description = "Local-first long-form to short-form clip studio"
authors = ["ClipOn"]
edition = "2021"

[lib]
name = "clipon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clipon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.6", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2.5", features = [] }
tauri-plugin-dialog = "2.2.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
url = "2.5"
sha2 = "0.10"
bytes = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
